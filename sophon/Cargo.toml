[workspace]
members = [
    "crates/sophon-core",
    "crates/prompt-compressor",
    "crates/memory-manager",
    "crates/delta-streamer",
    "crates/fragment-cache",
    "crates/semantic-retriever",
    "crates/output-compressor",
    "crates/cli-hooks",
    "crates/codebase-navigator",
    "crates/sophon-storage",
    "crates/mcp-integration",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
authors = ["Sophon Contributors"]

# Aggressive size + perf profile for the release binary that ships
# in `sophon/target/release/sophon` and gets attached to the GitHub
# Release. Trades compile time for ~25 % smaller artefact.
#
# - opt-level = 3     full speed. `"s"` and `"z"` were both tried
#                     and rejected — `"z"` regressed cold start from
#                     35 ms to 81 ms (tiktoken-rs's BPE merge loop
#                     became measurably slower); `"s"` to 43 ms.
#                     Keeping opt-level = 3 and letting lto + strip
#                     + panic = abort do the size work gives -39 %
#                     binary (8.6 MB → 5.2 MB) with **zero** cold
#                     start regression vs the v0.5.1 baseline.
# - lto       = "fat" cross-crate dead-code elimination + inlining.
# - codegen-units = 1 single unit makes lto strictly more effective
#                     at the cost of compile parallelism.
# - strip     = true  drop debug symbols from the release binary.
# - panic     = "unwind"
#                     REQUIRED for per-tool panic isolation. `run_stdio`
#                     dispatches every `tools/call` on a `spawn_blocking`
#                     task inside a `JoinSet`; a panic there is caught as a
#                     `JoinError` and turned into a JSON-RPC internal-error
#                     response, keeping the server (and every other session)
#                     alive. That catch only works while the stack can
#                     unwind — under `panic = "abort"` a single `unwrap` in
#                     any tool aborts the whole process. Costs some unwind
#                     tables (slightly larger binary); resilience wins.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.5"
once_cell = "1.20"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tiktoken-rs = "0.6"
toml = "0.8"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
