name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        working-directory: sophon
        run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: sophon
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sophon

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings

      # Continue tests and the release build after a lint failure so each
      # failing CI run reports actionable diagnostics from all stages.
      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked --no-fail-fast

      - name: cargo build --release
        id: release_build
        if: ${{ !cancelled() }}
        run: cargo build --release --locked -p mcp-integration

      - name: smoke test — sophon serve
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        shell: bash
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"count_tokens","arguments":{"text":"hello world"}}}' \
            | ./target/release/sophon serve

  npm-lint:
    name: npm wrapper lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node -c install.js
      - run: node -c bin/sophon.js
      - run: node -e "JSON.parse(require('fs').readFileSync('package.json'))"
      - run: npm test

  benchmark-driver-tests:
    name: Benchmark driver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate benchmark Python syntax
        run: python -m compileall -q benchmarks
      - name: Test benchmark protocol and diagnostics
        run: python -m unittest discover -s benchmarks/tests -v
