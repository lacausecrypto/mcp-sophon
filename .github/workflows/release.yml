name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release_tag:
    name: Create release tag and dispatch binary build
    # Normal commits cannot create a release. Only a reviewed release commit
    # whose title begins with chore(release): v0.7.1 triggers this job.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'chore(release): v0.7.1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and trigger GitHub-only release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./npm/package.json').version")
          [ "$version" = "0.7.1" ] || { echo 'Unexpected release version'; exit 1; }
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$version" -f sha="$GITHUB_SHA"
          # Tags pushed by GITHUB_TOKEN do not trigger push workflows. Explicit
          # workflow_dispatch (allowed for GITHUB_TOKEN) runs the release job.
          gh workflow run release.yml --ref "v$version"

  build:
    name: build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: sophon-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: sophon-x86_64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: sophon-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: sophon-aarch64-unknown-linux-gnu.tar.gz
            linker_pkg: gcc-aarch64-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: sophon-x86_64-pc-windows-msvc.zip
    defaults:
      run:
        working-directory: sophon

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-linker (Linux aarch64 only)
        if: matrix.linker_pkg
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker_pkg }}
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml

      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.target }} -p mcp-integration

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="sophon-${{ matrix.target }}"
          mkdir -p "$staging"
          cp target/${{ matrix.target }}/release/sophon "$staging/"
          cp ../README.md ../LICENSE ../BENCHMARK.md "$staging/"
          tar czf "../${{ matrix.archive }}" "$staging"
          shasum -a 256 "../${{ matrix.archive }}" > "../${{ matrix.archive }}.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "sophon-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/sophon.exe" "$staging/"
          Copy-Item "../README.md","../LICENSE","../BENCHMARK.md" "$staging/"
          Compress-Archive -Path $staging -DestinationPath "../${{ matrix.archive }}"
          (Get-FileHash "../${{ matrix.archive }}" -Algorithm SHA256).Hash | Out-File "../${{ matrix.archive }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  publish_release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            See [BENCHMARK.md](./BENCHMARK.md) for measured performance numbers and [README.md](./README.md) for install instructions.


  publish_npm:
    name: Publish npm package (only when NPM_TOKEN is configured)
    needs: publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check npm authentication
        id: auth
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not configured; npm publishing remains manual."
          fi
      - name: Verify npm version matches GitHub tag
        if: steps.auth.outputs.enabled == 'true'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "npm/tag version mismatch"; exit 1; }
          npm test
      - name: Publish npm if not already present
        if: steps.auth.outputs.enabled == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "mcp-sophon@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::notice::mcp-sophon@$version already exists on npm; nothing to publish."
          else
            npm publish --access public --registry=https://registry.npmjs.org
          fi
